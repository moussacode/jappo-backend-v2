spring.application.name=jappo-backend

# Profil actif, lu depuis le .env (dotenv-java le charge en propriete systeme,
# que Spring ne relie pas automatiquement a spring.profiles.active).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jappo}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# APP & SERVICES
# =========================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:4200}

# n8n (assistance) : desactive par defaut. Pour le reactiver : N8N_ENABLED=true + N8N_BASE_URL
n8n.enabled=${N8N_ENABLED:false}
n8n.base-url=${N8N_BASE_URL:http://localhost:5678}

# Le schema est cree uniquement par Flyway (db/migration). Hibernate se contente de le verifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway : part d'une base vide, V1__schema_initial.sql cree tout le schema.
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# =========================
# JWT
# =========================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# =========================
# MAIL
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# GOOGLE
# =========================
app.google.client-id=${GOOGLE_CLIENT_ID}

# =========================
# IA
# =========================
ai.orchestrator.url=${AI_ORCHESTRATOR_URL}
ai.orchestrator.api-key=${AI_API_KEY}
ai.orchestrator.timeout=${AI_TIMEOUT}

# =========================
# LIVEKIT
# =========================
livekit.api-key=${LIVEKIT_API_KEY}
livekit.api-secret=${LIVEKIT_API_SECRET}
livekit.host=${LIVEKIT_HOST}

# =========================================================
# PAYDUNYA
# =========================================================

paydunya.master-key=${PAYDUNYA_MASTER_KEY}
paydunya.private-key=${PAYDUNYA_PRIVATE_KEY}
paydunya.token=${PAYDUNYA_TOKEN}

# Sandbox PayDunya
paydunya.base-url=https://app.paydunya.com/sandbox-api/v1

paydunya.callback-url=${APP_BACKEND_PUBLIC_URL:http://localhost:8080}/api/paiements/paydunya/ipn

paydunya.return-url=${APP_FRONTEND_URL:http://localhost:4200}/paiement/succes

paydunya.cancel-url=${APP_FRONTEND_URL:http://localhost:4200}/paiement/annule

# SUPER_ADMIN_PASSWORD est obligatoire : sans lui, l'application refuse de demarrer.
jappo.super-admin.email=${SUPER_ADMIN_EMAIL:admin@jappo.sn}
jappo.super-admin.password=${SUPER_ADMIN_PASSWORD}
jappo.super-admin.prenom=Admin
jappo.super-admin.nom=JAPPO